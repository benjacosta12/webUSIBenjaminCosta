<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto - Saul Goodman</title>
    <link rel="stylesheet" type="text/css" href="./estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ENCABEZADO -->
    <header class="encabezado">
        <div class="caja-logo">
            <a href="index.html">
                <img src="./images/LOGO-removebg-preview.png" alt="Logo BCS" class="logo">
            </a>
        </div>
        
        <a href="#" class="icono">&#9776;</a>

        <nav class="topnav" id="miTopnav">
            <a href="index.html" class="enlaceNav">Inicio</a>
            <a href="servicios.html" class="enlaceNav">Servicios</a>
            <a href="sobreSaul.html" class="enlaceNav">Sobre Saul</a>
            <a href="casos.html" class="enlaceNav">Casos</a>
            <a href="preguntasFrecuentes.html" class="enlaceNav">Preguntas frecuentes</a>
            <a href="contacto.html" class="enlaceNav activo">Contacto</a>
        </nav>
    </header>

    <!-- SECCION PRINCIPAL: CONTACTO -->
    <section class="seccionContacto">
        <div class="contenedorContacto">
            <h1 class="titulo-seccion">CONTACTO</h1>
            <p class="bajadaContacto">Enviame tu consulta y me pondré en contacto a la brevedad.</p>

            <form class="formularioContacto" action="#" method="post">
                <div class="campoFormulario">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre">
                </div>

                <div class="campoFormulario">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ingresá tu apellido">
                </div>

                <div class="campoFormulario">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                </div>

                <div class="campoFormulario">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" name="celular" placeholder="Número de celular">
                </div>

                <div class="campoFormulario">
                    <label for="consulta">Consulta</label>
                    <textarea id="consulta" name="consulta" rows="6" placeholder="Escribí acá tu consulta..."></textarea>
                </div>

                <div class="cajaBotonContacto">
                    <button type="submit" class="botonEnviar">ENVIAR</button>
                </div>
            </form>
        </div>
    </section>

    <!-- PIE DE PAGINA -->
    <footer class="piePagina">
        <div class="pieContenedor">
            <div class="pieEnlaces">
                <a href="servicios.html">Servicios</a>
                <a href="contacto.html">Contacto</a>
            </div>
            <div class="pieFirma">
                <p>HECHO POR BENJAMÍN COSTA</p>
                <div class="pieRedes">
                    <a href="#"><img src="./images/facebook.png" alt="Facebook"></a>
                    <a href="#"><img src="./images/instagram.png" alt="Instagram"></a>
                    <a href="#"><img src="./images/gorjeo.png" alt="X"></a>
                </div>
            </div>
            <div class="pieBloqueDerecho">
                <div class="pieEnlaces">
                    <a href="sobreSaul.html">Sobre Saul</a>
                    <a href="#">Redes</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
